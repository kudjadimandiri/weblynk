<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script>
    // Redirect /artikel/slug.html → /artikel/?slug=slug
    const path = location.pathname;
    const parts = path.split('/').filter(Boolean);
    if (parts.length === 2) {
      const folder = parts[0];
      const file = parts[1].replace(/\.html?$/, '');
      if (['artikel', 'tools', 'games'].includes(folder)) {
        location.replace(`/${folder}/?slug=${encodeURIComponent(file)}`);
      }
    }
  </script>
</head>
<body></body>
</html>
