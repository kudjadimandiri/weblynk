<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebLynk CMS — Admin Panel</title>
  <meta name="robots" content="noindex, nofollow" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: {
      50:'#f0f9ff',100:'#e0f2fe',200:'#bae6fd',300:'#7dd3fc',400:'#38bdf8',
      500:'#0ea5e9',600:'#0284c7',700:'#0369a1',800:'#075985',900:'#0c4a6e'
    } } } } };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased">

  <!-- HEADER -->
  <header class="border-b border-slate-200 bg-white shadow-sm">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6">
      <a href="/" class="flex items-center gap-2 text-xl font-bold text-slate-900">
        <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-brand-600 text-white">W</span>
        <span>WebLynk <span class="text-xs font-normal text-slate-500">CMS</span></span>
      </a>
      <div class="flex items-center gap-3">
        <span id="authStatus" class="hidden rounded-full bg-green-100 px-3 py-1 text-xs font-semibold text-green-700">● Terhubung GitHub</span>
        <button id="settingsBtn" class="rounded-lg border border-slate-200 px-4 py-2 text-sm font-medium hover:bg-slate-50">⚙️ Pengaturan</button>
      </div>
    </div>
  </header>

  <div class="mx-auto max-w-7xl px-4 py-8 sm:px-6">

    <!-- TABS -->
    <div class="mb-6 flex flex-wrap gap-2 border-b border-slate-200">
      <button data-tab="posts" class="tab-btn border-b-2 border-brand-600 px-4 py-2 text-sm font-semibold text-brand-600">📝 Artikel</button>
      <button data-tab="tools" class="tab-btn border-b-2 border-transparent px-4 py-2 text-sm font-medium text-slate-500 hover:text-slate-700">🛠️ Tools</button>
      <button data-tab="games" class="tab-btn border-b-2 border-transparent px-4 py-2 text-sm font-medium text-slate-500 hover:text-slate-700">🎮 Games</button>
      <button data-tab="seo" class="tab-btn border-b-2 border-transparent px-4 py-2 text-sm font-medium text-slate-500 hover:text-slate-700">🔍 SEO</button>
    </div>

    <!-- TAB: POSTS -->
    <section data-panel="posts">
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-xl font-bold text-slate-900">Kelola Artikel</h2>
        <button onclick="openEditor('post')" class="rounded-xl bg-brand-600 px-4 py-2 text-sm font-bold text-white hover:bg-brand-700">+ Artikel Baru</button>
      </div>
      <div id="postsList" class="space-y-3"></div>
    </section>

    <!-- TAB: TOOLS -->
    <section data-panel="tools" class="hidden">
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-xl font-bold text-slate-900">Kelola Tools</h2>
        <button onclick="openEditor('tool')" class="rounded-xl bg-brand-600 px-4 py-2 text-sm font-bold text-white hover:bg-brand-700">+ Tool Baru</button>
      </div>
      <div id="toolsList" class="space-y-3"></div>
    </section>

    <!-- TAB: GAMES -->
    <section data-panel="games" class="hidden">
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-xl font-bold text-slate-900">Kelola Games</h2>
        <button onclick="openEditor('game')" class="rounded-xl bg-brand-600 px-4 py-2 text-sm font-bold text-white hover:bg-brand-700">+ Game Baru</button>
      </div>
      <div id="gamesList" class="space-y-3"></div>
    </section>

    <!-- TAB: SEO -->
    <section data-panel="seo" class="hidden">
      <h2 class="mb-4 text-xl font-bold text-slate-900">Pengaturan SEO Global</h2>
      <div class="rounded-2xl border border-slate-200 bg-white p-6">
        <div class="grid gap-4 sm:grid-cols-2">
          <div><label class="mb-1 block text-sm font-medium">Site Name</label><input id="cfgSiteName" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" /></div>
          <div><label class="mb-1 block text-sm font-medium">Site URL</label><input id="cfgSiteUrl" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" /></div>
          <div class="sm:col-span-2"><label class="mb-1 block text-sm font-medium">Description</label><textarea id="cfgDesc" rows="2" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm"></textarea></div>
          <div class="sm:col-span-2"><label class="mb-1 block text-sm font-medium">Keywords</label><input id="cfgKeywords" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" /></div>
          <div><label class="mb-1 block text-sm font-medium">OG Image URL</label><input id="cfgOgImage" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" /></div>
          <div><label class="mb-1 block text-sm font-medium">Twitter Handle</label><input id="cfgTwitter" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" /></div>
        </div>
        <button onclick="saveSEOConfig()" class="mt-6 rounded-xl bg-brand-600 px-6 py-2 text-sm font-bold text-white hover:bg-brand-700">💾 Simpan & Push ke GitHub</button>
      </div>
    </section>
  </div>

  <!-- MODAL EDITOR -->
  <div id="editorModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 p-4 backdrop-blur-sm">
    <div class="max-h-[90vh] w-full max-w-3xl overflow-y-auto rounded-2xl bg-white p-6 shadow-2xl">
      <div class="mb-4 flex items-center justify-between">
        <h3 id="editorTitle" class="text-lg font-bold">Edit</h3>
        <button onclick="closeEditor()" class="rounded-lg p-2 text-slate-500 hover:bg-slate-100">✕</button>
      </div>
      <div id="editorFields" class="space-y-4"></div>
      <div class="mt-6 flex justify-end gap-3">
        <button onclick="closeEditor()" class="rounded-xl border border-slate-200 px-5 py-2 text-sm font-medium hover:bg-slate-50">Batal</button>
        <button onclick="saveItem()" class="rounded-xl bg-brand-600 px-5 py-2 text-sm font-bold text-white hover:bg-brand-700">💾 Simpan & Push</button>
      </div>
    </div>
  </div>

  <!-- MODAL SETTINGS GITHUB -->
  <div id="settingsModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 p-4 backdrop-blur-sm">
    <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl">
      <h3 class="mb-4 text-lg font-bold">🔑 GitHub Connection</h3>
      <p class="mb-4 text-sm text-slate-600">Masukkan Personal Access Token (scope: <code class="rounded bg-slate-100 px-1">repo</code>) untuk push ke repository.</p>
      <div class="space-y-3">
        <div><label class="mb-1 block text-sm font-medium">GitHub Owner</label><input id="ghOwner" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" placeholder="username" /></div>
        <div><label class="mb-1 block text-sm font-medium">Repository</label><input id="ghRepo" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" placeholder="weblynk" /></div>
        <div><label class="mb-1 block text-sm font-medium">Branch</label><input id="ghBranch" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" value="main" /></div>
        <div><label class="mb-1 block text-sm font-medium">Personal Access Token</label><input id="ghToken" type="password" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" placeholder="ghp_..." /></div>
      </div>
      <div class="mt-6 flex justify-end gap-3">
        <button onclick="document.getElementById('settingsModal').classList.add('hidden')" class="rounded-xl border border-slate-200 px-5 py-2 text-sm font-medium hover:bg-slate-50">Tutup</button>
        <button onclick="saveGitHubSettings()" class="rounded-xl bg-brand-600 px-5 py-2 text-sm font-bold text-white hover:bg-brand-700">Simpan</button>
      </div>
    </div>
  </div>

  <script>
  // ===== STATE =====
  let state = { posts: [], tools: [], config: {}, editing: null, type: 'post' };

  // ===== GITHUB API =====
  const GH_KEY = 'weblynk_github';
  function getGH() {
    try { return JSON.parse(localStorage.getItem(GH_KEY) || '{}'); } catch { return {}; }
  }
  function setGH(cfg) { localStorage.setItem(GH_KEY, JSON.stringify(cfg)); }

  async function ghGet(path) {
    const { owner, repo, branch = 'main' } = getGH();
    if (!owner || !repo) throw new Error('GitHub belum dikonfigurasi');
    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`);
    if (!r.ok) throw new Error('Gagal ambil file: ' + path);
    return await r.json();
  }

  async function ghPut(path, content, message) {
    const { owner, repo, branch = 'main', token } = getGH();
    if (!owner || !repo || !token) throw new Error('GitHub token belum diisi');

    // Get current SHA if exists
    let sha;
    try {
      const existing = await ghGet(path);
      sha = existing.sha;
    } catch {}

    const body = {
      message: message || `Update ${path}`,
      content: btoa(unescape(encodeURIComponent(content))),
      branch,
      ...(sha ? { sha } : {})
    };

    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
      method: 'PUT',
      headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error('Gagal push: ' + (await r.text()));
    return await r.json();
  }

  // ===== LOAD DATA =====
  async function loadData() {
    try {
      const postsR = await fetch('/content/posts.json?t=' + Date.now());
      const toolsR = await fetch('/content/tools.json?t=' + Date.now());
      const cfgR = await fetch('/content/config.json?t=' + Date.now());

      if (postsR.ok) state.posts = (await postsR.json()).posts || [];
      if (toolsR.ok) {
        const all = (await toolsR.json()).tools || [];
        state.tools = all;
      }
      if (cfgR.ok) state.config = await cfgR.json();

      renderLists();
      fillSEOForm();
      checkAuth();
    } catch (e) {
      console.error(e);
      alert('Gagal memuat data: ' + e.message);
    }
  }

  function checkAuth() {
    const { token } = getGH();
    const el = document.getElementById('authStatus');
    if (token) el.classList.remove('hidden');
    else el.classList.add('hidden');
  }

  // ===== RENDER =====
  function renderLists() {
    const posts = state.posts;
    const tools = state.tools.filter(t => t.type === 'tool');
    const games = state.tools.filter(t => t.type === 'game');

    const row = (item, type) => `
      <div class="flex items-center justify-between rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
        <div class="flex items-center gap-3">
          <span class="text-2xl">${item.icon || (type === 'post' ? '📝' : type === 'tool' ? '🛠️' : '🎮')}</span>
          <div>
            <p class="font-semibold text-slate-900">${item.title || item.name}</p>
            <p class="text-xs text-slate-500">${item.category || ''} · ${item.date || ''}</p>
          </div>
        </div>
        <div class="flex gap-2">
          <button onclick="editItem('${type}', '${item.id}')" class="rounded-lg border border-slate-200 px-3 py-1.5 text-xs font-medium hover:bg-slate-50">✏️ Edit</button>
          <button onclick="deleteItem('${type}', '${item.id}')" class="rounded-lg border border-red-200 px-3 py-1.5 text-xs font-medium text-red-600 hover:bg-red-50">🗑️</button>
        </div>
      </div>`;

    document.getElementById('postsList').innerHTML = posts.length ? posts.map(p => row(p, 'post')).join('') : '<p class="text-slate-500">Belum ada artikel.</p>';
    document.getElementById('toolsList').innerHTML = tools.length ? tools.map(t => row(t, 'tool')).join('') : '<p class="text-slate-500">Belum ada tools.</p>';
    document.getElementById('gamesList').innerHTML = games.length ? games.map(g => row(g, 'game')).join('') : '<p class="text-slate-500">Belum ada games.</p>';
  }

  // ===== EDITOR =====
  function openEditor(type, id) {
    state.type = type;
    state.editing = id ? (type === 'post' ? state.posts : state.tools).find(i => i.id === id) : null;

    document.getElementById('editorTitle').textContent = (state.editing ? 'Edit ' : 'Baru ') + type;
    document.getElementById('editorFields').innerHTML = buildFields(type, state.editing || {});
    document.getElementById('editorModal').classList.remove('hidden');
    document.getElementById('editorModal').classList.add('flex');
  }

  function closeEditor() {
    document.getElementById('editorModal').classList.add('hidden');
    document.getElementById('editorModal').classList.remove('flex');
  }

  function buildFields(type, data) {
    const common = `
      <div><label class="mb-1 block text-sm font-medium">Meta Title (SEO)</label><input id="f_metaTitle" value="${data.metaTitle || ''}" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" /></div>
      <div><label class="mb-1 block text-sm font-medium">Meta Description (SEO)</label><textarea id="f_metaDescription" rows="2" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm">${data.metaDescription || ''}</textarea></div>`;

    if (type === 'post') {
      return `
        <div class="grid gap-4 sm:grid-cols-2">
          <div class="sm:col-span-2"><label class="mb-1 block text-sm font-medium">Judul</label><input id="f_title" value="${data.title || ''}" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" /></div>
          <div><label class="mb-1 block text-sm font-medium">Slug</label><input id="f_slug" value="${data.slug || ''}" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" /></div>
          <div><label class="mb-1 block text-sm font-medium">Kategori</label><input id="f_category" value="${data.category || 'SEO'}" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" /></div>
          <div><label class="mb-1 block text-sm font-medium">Tanggal</label><input id="f_date" type="date" value="${data.date || new Date().toISOString().slice(0,10)}" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" /></div>
          <div><label class="mb-1 block text-sm font-medium">Image URL</label><input id="f_image" value="${data.image || ''}" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" /></div>
          <div class="sm:col-span-2"><label class="mb-1 block text-sm font-medium">Excerpt</label><textarea id="f_excerpt" rows="2" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm">${data.excerpt || ''}</textarea></div>
          <div class="sm:col-span-2"><label class="mb-1 block text-sm font-medium">Konten (HTML)</label><textarea id="f_content" rows="6" class="w-full rounded-lg border border-slate-200 px-3 py-2 font-mono text-xs">${(data.content || '').replace(/</g,'&lt;')}</textarea></div>
          <div class="sm:col-span-2"><label class="mb-1 block text-sm font-medium">Tags (koma)</label><input id="f_tags" value="${(data.tags||[]).join(', ')}" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" /></div>
          ${common}
        </div>`;
    } else {
      return `
        <div class="grid gap-4 sm:grid-cols-2">
          <div><label class="mb-1 block text-sm font-medium">Nama</label><input id="f_name" value="${data.name || ''}" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" /></div>
          <div><label class="mb-1 block text-sm font-medium">Icon (emoji)</label><input id="f_icon" value="${data.icon || (type==='tool'?'🛠️':'🎮')}" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" /></div>
          <div><label class="mb-1 block text-sm font-medium">Kategori</label><input id="f_category" value="${data.category || (type==='tool'?'SEO':'Game')}" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" /></div>
          <div><label class="mb-1 block text-sm font-medium">URL</label><input id="f_url" value="${data.url || ''}" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" /></div>
          <div class="sm:col-span-2"><label class="mb-1 block text-sm font-medium">Deskripsi</label><textarea id="f_description" rows="2" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm">${data.description || ''}</textarea></div>
          ${common}
        </div>`;
    }
  }

  // ===== SAVE =====
  async function saveItem() {
    const type = state.type;
    const val = id => document.getElementById(id)?.value || '';

    let item;
    if (type === 'post') {
      item = {
        id: state.editing?.id || 'post-' + Date.now(),
        title: val('f_title'), slug: val('f_slug') || val('f_title').toLowerCase().replace(/\s+/g,'-'),
        excerpt: val('f_excerpt'), content: val('f_content'),
        category: val('f_category'), tags: val('f_tags').split(',').map(s=>s.trim()).filter(Boolean),
        author: state.editing?.author || 'WebLynk Team',
        date: val('f_date'), image: val('f_image'),
        featured: false,
        metaTitle: val('f_metaTitle'), metaDescription: val('f_metaDescription')
      };
      if (state.editing) state.posts = state.posts.map(p => p.id === item.id ? item : p);
      else state.posts.push(item);
    } else {
      item = {
        id: state.editing?.id || (type === 'tool' ? 'tool-' : 'game-') + Date.now(),
        name: val('f_name'), slug: val('f_name').toLowerCase().replace(/\s+/g,'-'),
        type: type, category: val('f_category'), description: val('f_description'),
        icon: val('f_icon'), url: val('f_url'),
        metaTitle: val('f_metaTitle'), metaDescription: val('f_metaDescription')
      };
      if (state.editing) state.tools = state.tools.map(t => t.id === item.id ? item : t);
      else state.tools.push(item);
    }

    try {
      if (type === 'post') {
        await ghPut('content/posts.json', JSON.stringify({ posts: state.posts }, null, 2), `CMS: update post ${item.title}`);
      } else {
        await ghPut('content/tools.json', JSON.stringify({ tools: state.tools }, null, 2), `CMS: update ${type} ${item.name}`);
      }
      alert('✅ Berhasil disimpan ke GitHub!');
      closeEditor();
      renderLists();
    } catch (e) {
      alert('❌ ' + e.message);
    }
  }

  function editItem(type, id) { openEditor(type, id); }

  async function deleteItem(type, id) {
    if (!confirm('Yakin hapus item ini?')) return;
    if (type === 'post') state.posts = state.posts.filter(p => p.id !== id);
    else state.tools = state.tools.filter(t => t.id !== id);
    try {
      if (type === 'post') await ghPut('content/posts.json', JSON.stringify({ posts: state.posts }, null, 2), 'CMS: delete post');
      else await ghPut('content/tools.json', JSON.stringify({ tools: state.tools }, null, 2), 'CMS: delete item');
      renderLists();
    } catch (e) { alert('❌ ' + e.message); }
  }

  // ===== SEO CONFIG =====
  function fillSEOForm() {
    const c = state.config;
    document.getElementById('cfgSiteName').value = c.siteName || '';
    document.getElementById('cfgSiteUrl').value = c.siteUrl || '';
    document.getElementById('cfgDesc').value = c.siteDescription || '';
    document.getElementById('cfgKeywords').value = c.siteKeywords || '';
    document.getElementById('cfgOgImage').value = c.ogImage || '';
    document.getElementById('cfgTwitter').value = c.twitterHandle || '';
  }

  async function saveSEOConfig() {
    const cfg = {
      ...state.config,
      siteName: document.getElementById('cfgSiteName').value,
      siteUrl: document.getElementById('cfgSiteUrl').value,
      siteDescription: document.getElementById('cfgDesc').value,
      siteKeywords: document.getElementById('cfgKeywords').value,
      ogImage: document.getElementById('cfgOgImage').value,
      twitterHandle: document.getElementById('cfgTwitter').value
    };
    try {
      await ghPut('content/config.json', JSON.stringify(cfg, null, 2), 'CMS: update SEO config');
      state.config = cfg;
      alert('✅ Konfigurasi SEO tersimpan!');
    } catch (e) { alert('❌ ' + e.message); }
  }

  // ===== GITHUB SETTINGS =====
  document.getElementById('settingsBtn').addEventListener('click', () => {
    const c = getGH();
    document.getElementById('ghOwner').value = c.owner || '';
    document.getElementById('ghRepo').value = c.repo || '';
    document.getElementById('ghBranch').value = c.branch || 'main';
    document.getElementById('ghToken').value = c.token || '';
    document.getElementById('settingsModal').classList.remove('hidden');
    document.getElementById('settingsModal').classList.add('flex');
  });

  function saveGitHubSettings() {
    setGH({
      owner: document.getElementById('ghOwner').value.trim(),
      repo: document.getElementById('ghRepo').value.trim(),
      branch: document.getElementById('ghBranch').value.trim() || 'main',
      token: document.getElementById('ghToken').value.trim()
    });
    document.getElementById('settingsModal').classList.add('hidden');
    document.getElementById('settingsModal').classList.remove('flex');
    checkAuth();
    alert('✅ Pengaturan GitHub tersimpan di browser.');
  }

  // ===== TABS =====
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('border-brand-600','text-brand-600');
        b.classList.add('border-transparent','text-slate-500');
      });
      btn.classList.add('border-brand-600','text-brand-600');
      btn.classList.remove('border-transparent','text-slate-500');

      document.querySelectorAll('[data-panel]').forEach(p => {
        p.classList.toggle('hidden', p.dataset.panel !== tab);
      });
    });
  });

  loadData();
  </script>
</body>
</html>
